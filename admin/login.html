<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Wearify</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-box">
    <div class="admin-logo"><span class="logo-badge">W</span>Wearify</div>
    <h1>Admin login</h1>
    <p class="sub">Sign in with an account that's been granted admin access. See README.md if you need to set this up.</p>
    <p class="form-error" id="adminLoginError"></p>
    <form id="adminLoginForm">
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn accent block">Log in</button>
    </form>
  </div>
</div>
<script type="module" src="../js/admin-login.js"></script>
</body>
</html>
